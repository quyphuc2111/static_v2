services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VERSION=v1
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://appuser:apppass@mysql:3306/appdb
      - NODE_ENV=production
      - NEXTAUTH_SECRET=change-me-to-a-secure-secret
      - NEXTAUTH_URL=https://static.zenadev.online
      - SESSION_PASSWORD=change-me-to-at-least-32-characters-long-secret
      - SESSION_COOKIE_NAME=bkt_session
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static.rule=Host(`static.zenadev.online`)"
      - "traefik.http.routers.static.entrypoints=websecure"
      - "traefik.http.routers.static.tls.certresolver=letsencrypt"
      - "traefik.http.services.static.loadbalancer.server.port=3000"
    networks:
      - proxy
      - internal

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3456:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  mysql_data:

networks:
  proxy:
    external: true
  internal:
    driver: bridge
